[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
metal = "0.33.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21.4"
libc = "0.2"
